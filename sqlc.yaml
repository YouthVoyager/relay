version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"        # 从 goose 迁移文件读取表结构
    queries: "internal/store/queries"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/store/sqlcgen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "pg_catalog.jsonb"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - db_type: "jsonb"
            go_type:
              import: "encoding/json"
              type: "RawMessage"